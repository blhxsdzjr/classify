# Update these paths on the server.
# YOLO segmentation labels are recommended:
# class x1 y1 x2 y2 ... xn yn, all coordinates normalized to [0, 1].
path: datasets/colm
train: images/train
val: images/val
test: images/test

# Keep white/yellow as the first two classes because the metric script evaluates
# those two by default. road_surface is optional and ignored by the metric script.
names:
  0: white_lane
  1: yellow_lane
  2: road_surface
